<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Watercolour headphones on a painted tile">
  <title>Headphones on a wet-on-wet wash</title>
  <defs>
    <filter id="deckle" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.055" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.28"/>
    </filter>
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.9"/></filter>
    <filter id="bead" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.9"/></filter>
    <clipPath id="ct"><path d="M15,6.4H49C54.2,6.4 58.4,10.6 58.4,15.8V48.6C58.4,53.8 54.2,58 49,58H15C9.8,58 5.6,53.8 5.6,48.6V15.8C5.6,10.6 9.8,6.4 15,6.4Z"/></clipPath>
    <linearGradient id="g1" x1="18%" y1="6%" x2="82%" y2="98%">
      <stop offset="0" stop-color="#4AA6A6"/><stop offset="0.5" stop-color="#2C7C83"/><stop offset="1" stop-color="#1D5F68"/>
    </linearGradient>
  </defs>
  <g filter="url(#deckle)">
    <path d="M15,6.4H49C54.2,6.4 58.4,10.6 58.4,15.8V48.6C58.4,53.8 54.2,58 49,58H15C9.8,58 5.6,53.8 5.6,48.6V15.8C5.6,10.6 9.8,6.4 15,6.4Z" fill="url(#g1)"/>
    <g clip-path="url(#ct)">
      <g filter="url(#soft)" style="mix-blend-mode:multiply">
        <ellipse cx="17" cy="16" rx="15" ry="12" fill="#2F6E9B" opacity="0.62"/>
        <ellipse cx="50" cy="50" rx="16" ry="13" fill="#2C7E62" opacity="0.5"/>
        <ellipse cx="47" cy="13" rx="10" ry="8.5" fill="#B4854C" opacity="0.46"/>
        <ellipse cx="33" cy="6" rx="8" ry="6" fill="#3F8F74" opacity="0.4"/>
        <ellipse cx="14" cy="47" rx="10" ry="9" fill="#1C4E5C" opacity="0.4"/>
      </g>
      <path d="M15,6.4H49C54.2,6.4 58.4,10.6 58.4,15.8V48.6C58.4,53.8 54.2,58 49,58H15C9.8,58 5.6,53.8 5.6,48.6V15.8C5.6,10.6 9.8,6.4 15,6.4Z" fill="none" stroke="#12454C" stroke-width="7" stroke-opacity="0.5" filter="url(#bead)"/>
      <g opacity="0.17" style="mix-blend-mode:multiply"><rect width="64" height="64" filter="url(#grain)"/></g>
    </g>
  </g>
  <g filter="url(#brush)" transform="translate(32,32) scale(0.92) translate(-32,-32)">
    <path d="M13.4,42.4V30.2C13.4,19.9 21.7,11.6 32,11.6C42.3,11.6 50.6,19.9 50.6,30.2V42.4" fill="none" stroke="#EEF8F3" stroke-width="6.2" stroke-linecap="round"/>
    <path d="M12.8,36.2C16.2,36.2 19,39 19,42.4V49.2C19,52.6 16.2,55.4 12.8,55.4C9.4,55.4 6.6,52.6 6.6,49.2V42.4C6.6,39 9.4,36.2 12.8,36.2Z" fill="#EEF8F3"/><path d="M51.2,36.2C54.6,36.2 57.4,39 57.4,42.4V49.2C57.4,52.6 54.6,55.4 51.2,55.4C47.8,55.4 45,52.6 45,49.2V42.4C45,39 47.8,36.2 51.2,36.2Z" fill="#EEF8F3"/>
  </g>
</svg>
