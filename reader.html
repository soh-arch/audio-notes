<title>GitHub Note Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#EDEFEF;
    --surface:#FFFFFF;
    --surface-2:#F5F6F6;
    --ink:#1B1F23;
    --ink-soft:#4B5259;
    --ink-faint:#818A8E;
    --accent:#2C5F63;
    --accent-soft:#DCEAEA;
    --accent-ink:#0F3A3D;
    --rule:#D7DAD9;
    --danger:#8A3B2E;
    --danger-soft:#F4E4DF;
    --shadow: 0 1px 2px rgba(20,24,25,0.04), 0 8px 24px -12px rgba(20,24,25,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181A;
      --surface:#1C2225;
      --surface-2:#20282B;
      --ink:#E8EAEA;
      --ink-soft:#ABB3B6;
      --ink-faint:#6E787B;
      --accent:#6FBFC2;
      --accent-soft:#203337;
      --accent-ink:#CDEEEF;
      --rule:#2A3134;
      --danger:#E0A08F;
      --danger-soft:#3A231D;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A;
    --surface:#1C2225;
    --surface-2:#20282B;
    --ink:#E8EAEA;
    --ink-soft:#ABB3B6;
    --ink-faint:#6E787B;
    --accent:#6FBFC2;
    --accent-soft:#203337;
    --accent-ink:#CDEEEF;
    --rule:#2A3134;
    --danger:#E0A08F;
    --danger-soft:#3A231D;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .shell{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 96px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  header.bar{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .brand .tagline{
    font-size:12.5px;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }

  form.loader{
    display:flex;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:6px;
    box-shadow:var(--shadow);
  }
  form.loader input[type="text"]{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    padding:10px 10px;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;
    color:var(--ink);
  }
  form.loader input[type="text"]::placeholder{ color:var(--ink-faint); }
  form.loader input[type="text"]:focus{ outline:none; }
  form.loader button{
    flex:none;
    border:none;
    border-radius:7px;
    background:var(--accent);
    color:var(--surface);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:0 18px;
    cursor:pointer;
  }
  form.loader button:focus-visible, form.loader input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  form.loader button:active{ transform:translateY(1px); }

  .hint{
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.6;
  }
  .hint code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    background:var(--surface-2);
    padding:1px 5px;
    border-radius:4px;
    color:var(--ink-soft);
  }

  .status{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--rule);
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .status[hidden]{ display:none; }
  .status.error{
    background:var(--danger-soft);
    border-color:transparent;
    color:var(--danger);
  }
  .spinner{
    width:14px; height:14px;
    border-radius:50%;
    border:2px solid var(--rule);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
    flex:none;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:2.4s; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  article.paper{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:44px clamp(20px,6vw,64px) 56px;
  }
  article.paper[hidden]{ display:none; }

  .meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 10px;
    padding-bottom:20px;
    margin-bottom:28px;
    border-bottom:1px solid var(--rule);
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:.02em;
  }
  .meta .repo{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--ink-soft);
  }
  .meta a{
    color:var(--accent-ink);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }
  .meta .dot{ color:var(--rule); }

  .doc{
    font-family:"Noto Serif JP","Shippori Mincho",serif;
    font-size:17px;
    line-height:2;
    color:var(--ink);
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  .doc h1,.doc h2,.doc h3{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    color:var(--ink);
    text-wrap:balance;
    line-height:1.5;
  }
  .doc h1{ font-size:26px; margin:0 0 20px; padding-bottom:14px; border-bottom:2px solid var(--accent); }
  .doc h2{ font-size:20px; margin:40px 0 16px; }
  .doc h3{ font-size:17px; margin:32px 0 12px; color:var(--accent-ink); }
  .doc p{ margin:0 0 22px; }
  .doc ul,.doc ol{ margin:0 0 22px; padding-left:1.4em; }
  .doc li{ margin:0 0 8px; }
  .doc li::marker{ color:var(--accent); }
  .doc blockquote{
    margin:0 0 22px;
    padding:2px 0 2px 18px;
    border-left:3px solid var(--accent);
    color:var(--ink-soft);
    font-style:italic;
  }
  .doc a{ color:var(--accent-ink); }
  .doc hr{ border:none; border-top:1px solid var(--rule); margin:36px 0; }
  .doc code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    background:var(--surface-2);
    padding:2px 6px;
    border-radius:4px;
    font-size:15px;
  }
  .doc pre{
    background:var(--surface-2);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:16px;
    overflow-x:auto;
  }
  .doc pre code{ background:none; padding:0; }
  .doc table{ width:100%; border-collapse:collapse; margin:0 0 22px; font-size:15px; }
  .doc th,.doc td{ border:1px solid var(--rule); padding:8px 10px; text-align:left; }
  .doc img{ max-width:100%; border-radius:6px; }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
    font-size:13.5px;
    line-height:1.8;
  }
  .empty .glyph{
    font-family:"Shippori Mincho",serif;
    font-size:34px;
    color:var(--ink-faint);
    display:block;
    margin-bottom:10px;
  }

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-faint);
    padding-top:6px;
  }
</style>

<div class="shell">
  <header class="bar">
    <div class="brand">
      <span class="mark">GitHub Note Reader</span>
      <span class="tagline">Markdownを記事として開く</span>
    </div>
    <form class="loader" id="loaderForm">
      <input type="text" id="srcInput" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="GitHubのファイルURL、または raw.githubusercontent.com のURL">
      <button type="submit">開く</button>
    </form>
    <p class="hint">GitHubの <code>blob</code> URLを貼っても自動で <code>raw</code> 形式に変換します。末尾に <code>?src=URL</code> を付けたリンクを開くと、この欄が自動で埋まります。</p>
  </header>

  <div class="status" id="status" hidden>
    <span class="spinner" id="spinner"></span>
    <span id="statusText">読み込み中…</span>
  </div>

  <article class="paper" id="paper" hidden>
    <div class="meta" id="meta"></div>
    <div class="doc" id="doc"></div>
  </article>

  <div class="empty" id="emptyState" hidden>
    <span class="glyph">未読</span>
    上のURL欄にNoteのリンクを貼って「開く」を押してください。
  </div>

  <footer>本文はソースのURLから直接取得して表示しています。保存やアップロードは行いません。</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
(function(){
  var DEFAULT_SRC = "https://raw.githubusercontent.com/soh-arch/audio-notes/main/oku-no-hosomichi.md";

  var form = document.getElementById('loaderForm');
  var input = document.getElementById('srcInput');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var paper = document.getElementById('paper');
  var metaEl = document.getElementById('meta');
  var docEl = document.getElementById('doc');
  var emptyEl = document.getElementById('emptyState');

  function toRawUrl(url){
    try{
      var u = new URL(url);
      if(u.hostname === 'github.com'){
        // https://github.com/OWNER/REPO/blob/BRANCH/PATH
        var parts = u.pathname.split('/').filter(Boolean);
        var blobIdx = parts.indexOf('blob');
        if(blobIdx > 1){
          var owner = parts[0], repo = parts[1];
          var branch = parts[blobIdx+1];
          var path = parts.slice(blobIdx+2).join('/');
          return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/' + path;
        }
      }
      return url;
    }catch(e){
      return url;
    }
  }

  function parseRepoInfo(rawUrl){
    try{
      var u = new URL(rawUrl);
      if(u.hostname === 'raw.githubusercontent.com'){
        var parts = u.pathname.split('/').filter(Boolean);
        return {
          owner: parts[0], repo: parts[1], branch: parts[2],
          path: parts.slice(3).join('/'),
          blobUrl: 'https://github.com/' + parts[0] + '/' + parts[1] + '/blob/' + parts[2] + '/' + parts.slice(3).join('/')
        };
      }
    }catch(e){}
    return null;
  }

  function setStatus(msg, isError){
    statusEl.hidden = false;
    document.getElementById('spinner').hidden = !!isError;
    statusEl.classList.toggle('error', !!isError);
    statusText.textContent = msg;
  }
  function clearStatus(){ statusEl.hidden = true; statusEl.classList.remove('error'); }

  function render(text, rawUrl){
    var info = parseRepoInfo(rawUrl);
    metaEl.innerHTML = '';
    if(info){
      var repoSpan = document.createElement('span');
      repoSpan.className = 'repo';
      repoSpan.textContent = info.owner + '/' + info.repo + ' · ' + info.path;
      metaEl.appendChild(repoSpan);
      var dot = document.createElement('span');
      dot.className = 'dot'; dot.textContent = '·';
      metaEl.appendChild(dot);
      var link = document.createElement('a');
      link.href = info.blobUrl; link.target = '_blank'; link.rel = 'noopener';
      link.textContent = 'GitHubで開く';
      metaEl.appendChild(link);
    }
    var html = marked.parse(text);
    var clean = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(html) : html;
    docEl.innerHTML = clean;
    paper.hidden = false;
    emptyEl.hidden = true;
    clearStatus();
  }

  function load(url){
    if(!url){ return; }
    var raw = toRawUrl(url.trim());
    input.value = raw;
    try{ localStorage.setItem('ghNoteReader:lastSrc', raw); }catch(e){}
    paper.hidden = true;
    emptyEl.hidden = true;
    setStatus('読み込み中…');
    fetch(raw, { cache: 'no-store' })
      .then(function(res){
        if(!res.ok){ throw new Error('HTTP ' + res.status); }
        return res.text();
      })
      .then(function(text){ render(text, raw); })
      .catch(function(err){
        setStatus('読み込めませんでした（' + err.message + '）。URLがpublicリポジトリのファイルか確認してください。', true);
      });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    load(input.value);
  });

  var qs = new URLSearchParams(location.search);
  var initial = qs.get('src');
  if(!initial){
    try{ initial = localStorage.getItem('ghNoteReader:lastSrc') || ''; }catch(e){ initial = ''; }
  }
  if(!initial){ initial = DEFAULT_SRC; }
  input.value = initial;
  if(initial){ load(initial); } else { emptyEl.hidden = false; }
})();
</script>
